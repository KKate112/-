<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: auto;
        }

        tr,
        td {
            height: 22vh;
        }

        .box {
            width: 100%;
            height: 100%;
        }

        .box1 {
            background-color: #8cc4bb;
        }

        .box21 {
            background-color: #daad9c;
        }

        .box22 {
            background-color: #6E554F;
        }

        .box31 {
            background-color: #b9b17e;
        }

        .box32 {
            background-color:#afc78b;
        }

        .box33 {
            background-color: #CFD29B;
        }

        .box41 {
            background-color:#3A5A40;
        }

        .box42 {
            background-color: #A3B18A;
        }

        .box43 {
            background-color:#588157;
        }

        .box44 {
            background-color: #2F3E2C;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>
                <div class="box box1"> 
            </td>
        </tr>

    </table>

    <table>

        <tr>
            <td width="50%">
                <div class="box box21">
            </td>
            <td>
                <div class="box box22">
                </div>
            </td>
        </tr>
    </table>

    <table>

        <tr>
            <td width="33%">
                <div class="box box31">
                </div>
            </td>
            <td width="33%">
                <div class="box box32">
                </div>
            </td>
            <td width="33%">
                <div class="box box33">
                </div>
            </td>
        </tr>
    </table>

    <table>

        <tr>
            <td width="25%">
                <div class="box box41">
                </div>
            </td>
            <td width="25%">
                <div class="box box42">
                </div>
            </td>
            <td width="25%">
                <div class="box box43">
                </div>
            </td>
            <td width="25%">
                <div class="box box44">
                </div>
            </td>
        </tr>
    </table>
</body>

</html>
