<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        .container{
            width: 80%;
            height: 50vh;
            background-color: navy;
            margin: auto;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .item{
            width: 300px;
            height: 300px;
            background-color: palegoldenrod;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
