<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <style>
        table, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
        td{
            width: 300px;
            height: 300px;
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <!-- colspan 2_橫佔兩格 -->
            <td colspan="2">11</td>
            <td>13</td>
        </tr>
        <tr>
            <td>21</td>
            <td>22</td>
            <td rowspan="2">23</td>
            <!-- rowspan 2_直佔兩格 -->
        </tr>
        <tr>
            <td>31</td>
            <td>32</td>
        </tr>
    </table>
    
</body>
</html>
