<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>販賣部</title>
    <style>
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            text-align: center;
        }

        td,
        tr {
            border: 3px solid navy;
        }

        input[type="number"] {
            width: 60px;
            text-align: center;
        }

        .discount-notice {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td>品項</td>
            <td>選項</td>
            <td>價格</td>
            <td>數量</td>
            <td>小計</td>
        </tr>
        <tr>
            <td>爆米花</td>
            <td>
                <label>
                    <input type="radio" name="favor1" id="sweet" checked>甜
                </label>
                <label>
                    <input type="radio" name="favor1" id="salt">鹹
                </label>
                <label>
                    <input type="radio" name="favor1" id="mix">綜合
                </label>
            </td>
            <td>150</td>
            <td>
                <input type="number" name="NUM1" id="NUM1" value="0" min="0" oninput="calculate()">
            </td>
            <td id="subtotal1">0</td>
        </tr>
        <tr>
            <td>吉拿棒</td>
            <td>
                <label>
                    <input type="radio" name="favor2" id="OG" checked>原味
                </label>
                <label>
                    <input type="radio" name="favor2" id="chocolate">巧克力
                </label>
            </td>
            <td>80</td>
            <td>
                <input type="number" name="NUM2" id="NUM2" value="0" min="0" oninput="calculate()">
            </td>
            <td id="subtotal2">0</td>
        </tr>
        <tr>
            <td>熱狗堡</td>
            <td>
                <label>
                    <input type="radio" name="favor3" id="nono" checked>不加醬
                </label>
                <label>
                    <input type="radio" name="favor3" id="ketchup">番茄醬
                </label>
                <label>
                    <input type="radio" name="favor3" id="Mustard">黃芥末
                </label>
            </td>
            <td>80</td>
            <td>
                <input type="number" name="NUM3" id="NUM3" value="0" min="0" oninput="calculate()">
            </td>
            <td id="subtotal3">0</td>
        </tr>
        <tr>
            <td>軟飲</td>
            <td>
                <label>
                    <input type="radio" name="favor4" id="coke" checked>可樂
                </label>
                <label>
                    <input type="radio" name="favor4" id="spirit">雪碧
                </label>
                <label>
                    <input type="radio" name="favor4" id="icetea">檸檬紅茶
                </label>
            </td>
            <td>45</td>
            <td>
                <input type="number" name="NUM4" id="NUM4" value="0" min="0" oninput="calculate()">
            </td>
            <td id="subtotal4">0</td>
        </tr>
    </table>
    <!-- 最下方的結算、滿額優惠與折扣碼專區 -->
    <tfoot>
        <!-- 1. 滿額 666 打 95 折提示列 -->
        <tr>
            <td colspan="5">
                🎉 <b>滿額優惠：</b>消費滿 $666 即享 95 折優惠！
                <div id="滿額提示" class="discount-notice">目前未達滿額門檻</div>
            </td>
        </tr>
        <!-- 2. 折扣碼輸入列 -->
        <tr>
            <td colspan="3">折扣碼折抵 (輸入 VIP 可再折 50 元)</td>
            <td colspan="2">
                <input type="text" id="couponCode" placeholder="請輸入折扣碼" oninput="calculate()">
            </td>
        </tr>
        <!-- 3. 最終總金額顯示列 -->
        <tr>
            <td colspan="3" style="font-weight: bold; font-size: 1.1em;">最終結帳總金額</td>
            <td colspan="2" id="finalTotal" style="font-weight: bold; font-size: 1.2em; color: red;">$0</td>
        </tr>
    </tfoot>
    </table>

    <!-- 負責計算所有金額變化的 JavaScript -->
    <script>
        function calculate() {
            // 1. 定義各品項單價
            const p1 = 150, p2 = 80, p3 = 80, p4 = 45;

            // 2. 抓取各數量輸入框的值 (若空白則視為 0)
            const num1 = parseInt(document.getElementById('NUM1').value) || 0;
            const num2 = parseInt(document.getElementById('NUM2').value) || 0;
            const num3 = parseInt(document.getElementById('NUM3').value) || 0;
            const num4 = parseInt(document.getElementById('NUM4').value) || 0;

            // 3. 計算各項小計
            const sub1 = p1 * num1;
            const sub2 = p2 * num2;
            const sub3 = p3 * num3;
            const sub4 = p4 * num4;

            // 將小計填入對應的 td 中
            document.getElementById('subtotal1').innerText = sub1;
            document.getElementById('subtotal2').innerText = sub2;
            document.getElementById('subtotal3').innerText = sub3;
            document.getElementById('subtotal4').innerText = sub4;

            // 4. 計算未折扣前的總金額
            let rawTotal = sub1 + sub2 + sub3 + sub4;
            let currentTotal = rawTotal;

            // 5. 判斷是否達到滿 666 打 95 折
            const noticeEl = document.getElementById('滿額提示');
            if (rawTotal >= 666) {
                currentTotal = Math.round(currentTotal * 0.95); // 四捨五入
                noticeEl.innerText = "✨ 已達 $666 門檻，已自動套用 95 折優惠！";
                noticeEl.style.color = "green";
            } else {
                noticeEl.innerText = `目前未達滿額門檻（還差 $${666 - rawTotal} 才能打折）`;
                noticeEl.style.color = "#d9534f";
            }

            // 6. 檢查折扣碼 (例如輸入 VIP 可以再折 50 元)
            const code = document.getElementById('couponCode').value.trim().toUpperCase();
            if (code === 'VIP') {
                currentTotal = Math.max(0, currentTotal - 50); // 最低不會扣到負數
            }

            // 7. 更新畫面上的最終總金額
            document.getElementById('finalTotal').innerText = '$' + currentTotal;
        }
    </script>
</body>
</body>

</html>
