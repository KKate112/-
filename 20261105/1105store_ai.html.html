<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小賣部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E6ECF4; --surface:#FFFFFF; --ink:#1B2A4A; --muted:#5A6680; --line:#D3DAE6;
    --chip:#EEF2F8; --red:#C8102E; --red-ink:#C8102E; --gold:#F2B705; --navy:#1B2A4A; --ok:#1F7A3E;
    color-scheme: light;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1524; --surface:#16213A; --ink:#F2F0EA; --muted:#A7B0C4; --line:#2C3A5C;
      --chip:#1F2C4A; --red-ink:#FF6476; --ok:#5BD08A; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1524; --surface:#16213A; --ink:#F2F0EA; --muted:#A7B0C4; --line:#2C3A5C;
    --chip:#1F2C4A; --red-ink:#FF6476; --ok:#5BD08A; color-scheme:dark;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.5;
  }
  .num{font-family:"Alfa Slab One","Rockwell","Georgia",serif;font-weight:400;letter-spacing:.01em}

  /* 紅白條紋遮陽篷 */
  .awning{height:46px;position:relative;background:repeating-linear-gradient(90deg,var(--red) 0 40px,#fff 40px 80px)}
  .awning::after{
    content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:
      radial-gradient(circle at 20px 0,var(--red) 13px,transparent 14px) 0 0/80px 14px repeat-x,
      radial-gradient(circle at 20px 0,#fff 13px,transparent 14px) 40px 0/80px 14px repeat-x;
  }

  /* 戲院跑馬燈招牌 */
  .marquee{
    max-width:1100px;margin:40px auto 0;padding:34px 24px 30px;
    background:var(--navy);color:#fff;text-align:center;position:relative;
    border:6px solid var(--red);border-radius:20px;
    width:calc(100% - 32px);
  }
  .marquee::before{
    content:"";position:absolute;inset:10px;border:6px dotted var(--gold);border-radius:12px;
    animation:blink 1.4s steps(2) infinite;
  }
  @keyframes blink{50%{border-color:#FFE48A}}
  @media (prefers-reduced-motion: reduce){.marquee::before{animation:none}}
  .marquee .script{font-family:"Alfa Slab One",Georgia,serif;color:var(--gold);font-size:clamp(1.1rem,2.6vw,1.5rem);margin:0;line-height:1.2}
  .marquee h1{
    margin:14px 0 18px;font-weight:900;font-size:clamp(2.8rem,8vw,4.6rem);line-height:1;
    letter-spacing:.12em;padding-left:.12em;text-shadow:4px 4px 0 var(--red);
  }
  .marquee p.deal{margin:0;color:#DCE3F0;font-weight:500;font-size:clamp(.95rem,2.2vw,1.05rem);line-height:1.2}
  .marquee p.deal b{color:var(--gold)}

  /* 版面 */
  .wrap{
    max-width:1100px;margin:28px auto 48px;padding:0 16px;
    display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;
  }
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}

  .menu{background:var(--surface);border-radius:16px;overflow:hidden;border:3px solid var(--line)}
  .menu-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 20px;border-bottom:4px solid var(--red);
  }
  .menu-head h2{margin:0;font-weight:900;font-size:1.4rem}
  .menu-head span{color:var(--muted);font-size:.9rem}

  .item{
    display:grid;grid-template-columns:104px 1fr auto;
    grid-template-areas:"pic head price" "pic flav flav" "pic . sub";
    gap:10px 18px;padding:20px;border-bottom:2px dashed var(--line);align-items:center;
  }
  .item:last-child{border-bottom:0}
  .pic{grid-area:pic;align-self:start;width:104px;height:104px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:3px solid var(--line)}
  .pic svg{width:84px;height:84px}
  .item h3{grid-area:head;margin:0;font-size:1.3rem;font-weight:900}
  .item h3 small{display:block;font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
  .price{
    grid-area:price;justify-self:end;background:var(--red);color:#fff;padding:4px 14px 4px 12px;
    font-size:1.15rem;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);padding-left:18px;
  }
  .flavors{grid-area:flav;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .flavor{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:var(--chip);border:2px solid var(--line);border-radius:12px}
  .flavor > span{font-weight:700}
  .flavor.on{border-color:var(--navy);background:var(--surface)}
  :root[data-theme="dark"] .flavor.on{border-color:var(--gold)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flavor.on{border-color:var(--gold)}}

  .qty{display:inline-flex;flex:none;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
  .qty button{width:36px;height:36px;border:0;background:var(--chip);color:var(--ink);font-size:1.3rem;font-weight:700;cursor:pointer}
  .qty button:hover{background:var(--line)}
  .qty button:focus-visible,.qty input:focus-visible,#couponCode:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
  .qty input{
    width:46px;border:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);
    text-align:center;font-size:1.1rem;background:var(--surface);color:var(--ink);
    -moz-appearance:textfield;appearance:textfield;
  }
  .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sub{grid-area:sub;justify-self:end;color:var(--muted);font-size:.9rem}
  .sub output{color:var(--ink);font-size:1.25rem;margin-left:6px}

  @media (max-width:520px){
    .item{grid-template-columns:72px 1fr auto;padding:16px;gap:10px 12px}
    .pic{width:72px;height:72px}
    .pic svg{width:58px;height:58px}
  }

  /* 結帳收據 */
  .ticket{
    background:var(--surface);border-radius:16px;overflow:hidden;border:3px solid var(--line);
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);
  }
  @media (max-width:860px){.ticket{position:static}}
  .ticket-head{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold)}
  .ticket-head h2{margin:0;font-weight:900;font-size:1.3rem;letter-spacing:.08em}
  .ticket-head span{font-family:"Alfa Slab One",Georgia,serif;color:var(--gold);font-size:.9rem}
  .ticket-body{padding:18px 20px 22px}
  .lines{list-style:none;margin:0;padding:0;font-size:.95rem}
  .lines li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .lines li em{font-style:normal;color:var(--muted)}
  .lines .empty{color:var(--muted);display:block}
  .tear{border-top:2px dashed var(--line);margin:16px -20px;position:relative}
  .tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
  .tear::before{left:-13px}.tear::after{right:-13px}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
  .row.total{font-weight:700;font-size:1.05rem}
  .row.total .num{font-size:1.35rem}
  .row.minus{color:var(--ok)}
  .row.minus.off{color:var(--muted)}
  .meter{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
  .meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s ease}
  .meter.full i{background:var(--ok)}
  @media (prefers-reduced-motion: reduce){.meter i{transition:none}}
  .discount-notice{font-size:.88rem;margin:0 0 6px;color:var(--red-ink)}
  .coupon{display:flex;gap:8px;margin:14px 0 4px}
  .coupon label{flex:none;align-self:center;font-weight:700;font-size:.95rem}
  #couponCode{
    flex:1;min-width:0;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;
    background:var(--surface);color:var(--ink);font:inherit;text-transform:uppercase;
  }
  .coupon-msg{font-size:.85rem;min-height:1.3em;margin:0;color:var(--muted)}
  .coupon-msg.ok{color:var(--ok)} .coupon-msg.bad{color:var(--red-ink)}
  .final{
    margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--chip);
    display:flex;justify-content:space-between;align-items:center;border:2px solid var(--red);
  }
  .final span{font-weight:900}
  #finalTotal{color:var(--red-ink);font-size:2rem;line-height:1}
</style>
</head>
<body>
  <div class="awning" aria-hidden="true"></div>

  <header class="marquee">
    <p class="script">Snack Bar</p>
    <h1>小賣部</h1>
    <p class="deal">消費滿 <b>$666</b> 享 95 折，輸入折扣碼 <b>VIP</b> 再折 $50</p>
  </header>

  <main class="wrap">
    <section class="menu" aria-label="菜單">
      <div class="menu-head"><h2>今日菜單</h2><span>選好口味和數量就能結帳</span></div>

      <!-- 爆米花 -->
      <article class="item">
        <div class="pic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <g fill="#FFF3CC" stroke="#E2B44A" stroke-width="1.5">
              <circle cx="30" cy="34" r="9"/><circle cx="44" cy="26" r="10"/><circle cx="58" cy="25" r="10"/>
              <circle cx="71" cy="33" r="9"/><circle cx="38" cy="38" r="9"/><circle cx="52" cy="35" r="10"/><circle cx="64" cy="39" r="8"/>
              <circle cx="50" cy="16" r="7"/>
            </g>
            <polygon points="22,40 78,40 70,94 30,94" fill="#fff" stroke="#9E0B23" stroke-width="1.5"/>
            <polygon points="22,40 33.2,40 38,94 30,94" fill="#C8102E"/>
            <polygon points="44.4,40 55.6,40 54,94 46,94" fill="#C8102E"/>
            <polygon points="66.8,40 78,40 70,94 62,94" fill="#C8102E"/>
            <rect x="20" y="38" width="60" height="6" rx="2" fill="#1B2A4A"/>
          </svg>
        </div>
        <h3>爆米花<small>Popcorn</small></h3>
        <div class="price num">$150</div>
        <div class="flavors" id="flavors1"></div>
        <div class="sub">小計<output class="num" id="subtotal1">0</output></div>
      </article>

      <!-- 吉拿棒 -->
      <article class="item">
        <div class="pic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <g transform="rotate(-12 50 60)">
              <rect x="33" y="8" width="13" height="72" rx="6.5" fill="#C9843A" stroke="#8E5520" stroke-width="1.5"/>
              <line x1="37.5" y1="12" x2="37.5" y2="76" stroke="#A9692A" stroke-width="1.5"/>
              <line x1="41.5" y1="12" x2="41.5" y2="76" stroke="#A9692A" stroke-width="1.5"/>
            </g>
            <g transform="rotate(10 50 60)">
              <rect x="52" y="12" width="13" height="70" rx="6.5" fill="#D4924A" stroke="#8E5520" stroke-width="1.5"/>
              <line x1="56.5" y1="16" x2="56.5" y2="78" stroke="#A9692A" stroke-width="1.5"/>
              <line x1="60.5" y1="16" x2="60.5" y2="78" stroke="#A9692A" stroke-width="1.5"/>
            </g>
            <g fill="#fff"><circle cx="38" cy="22" r="1.3"/><circle cx="43" cy="32" r="1.3"/><circle cx="58" cy="24" r="1.3"/><circle cx="62" cy="36" r="1.3"/><circle cx="40" cy="44" r="1.3"/><circle cx="57" cy="47" r="1.3"/></g>
            <polygon points="26,60 74,60 67,94 33,94" fill="#C8102E" stroke="#9E0B23" stroke-width="1.5"/>
            <rect x="29" y="70" width="42" height="7" fill="#fff"/>
          </svg>
        </div>
        <h3>吉拿棒<small>Churros</small></h3>
        <div class="price num">$80</div>
        <div class="flavors" id="flavors2"></div>
        <div class="sub">小計<output class="num" id="subtotal2">0</output></div>
      </article>

      <!-- 熱狗堡 -->
      <article class="item">
        <div class="pic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <rect x="12" y="44" width="76" height="30" rx="15" fill="#D99A4A"/>
            <rect x="6" y="39" width="88" height="17" rx="8.5" fill="#B6452C" stroke="#7E2A18" stroke-width="1.5"/>
            <polyline id="ketchupLine" points="14,44 22,48 30,41 38,48 46,41 54,48 62,41 70,48 78,41 86,46" fill="none" stroke="#D7261E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" visibility="hidden"/>
            <polyline id="mustardLine" points="14,50 22,54 30,47 38,54 46,47 54,54 62,47 70,54 78,47 86,52" fill="none" stroke="#F2B705" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" visibility="hidden"/>
            <path d="M12 56 Q50 72 88 56 L88 64 Q88 79 73 79 L27 79 Q12 79 12 64Z" fill="#F0BC6B" stroke="#B87A2E" stroke-width="1.5"/>
            <g fill="#FFF3CC"><ellipse cx="34" cy="70" rx="2" ry="1"/><ellipse cx="50" cy="73" rx="2" ry="1"/><ellipse cx="66" cy="70" rx="2" ry="1"/></g>
          </svg>
        </div>
        <h3>熱狗堡<small>Hot Dog</small></h3>
        <div class="price num">$80</div>
        <div class="flavors" id="flavors3"></div>
        <div class="sub">小計<output class="num" id="subtotal3">0</output></div>
      </article>

      <!-- 軟飲 -->
      <article class="item">
        <div class="pic" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <g transform="rotate(14 58 30)">
              <rect x="55" y="2" width="6" height="30" fill="#fff" stroke="#1B2A4A" stroke-width="1.2"/>
              <rect x="55" y="8" width="6" height="4" fill="#C8102E"/><rect x="55" y="18" width="6" height="4" fill="#C8102E"/>
            </g>
            <polygon points="28,32 72,32 66,94 34,94" fill="#C8102E" stroke="#9E0B23" stroke-width="1.5"/>
            <polygon points="30.4,52 69.6,52 67.9,70 32.1,70" fill="#fff"/>
            <polygon points="50,54.5 51.8,58.7 56.2,59 52.8,61.9 53.9,66.2 50,63.8 46.1,66.2 47.2,61.9 43.8,59 48.2,58.7" fill="#1B2A4A"/>
            <rect x="24" y="26" width="52" height="8" rx="3" fill="#F2F4F8" stroke="#1B2A4A" stroke-width="1.2"/>
          </svg>
        </div>
        <h3>軟飲<small>Soda</small></h3>
        <div class="price num">$45</div>
        <div class="flavors" id="flavors4"></div>
        <div class="sub">小計<output class="num" id="subtotal4">0</output></div>
      </article>
    </section>

    <!-- 結算、滿額優惠與折扣碼 -->
    <aside class="ticket" aria-label="結帳">
      <div class="ticket-head"><h2>結帳</h2><span>Admit One</span></div>
      <div class="ticket-body">
        <ul class="lines" id="orderLines"><li class="empty">還沒有點餐，加上數量就會出現在這裡。</li></ul>

        <div class="tear" aria-hidden="true"></div>

        <!-- 總計（折扣前） -->
        <div class="row total"><span>總計</span><span class="num" id="grandTotal">$0</span></div>

        <!-- 滿額 666 打 95 折 -->
        <div class="meter" id="meter" aria-hidden="true"><i id="meterBar"></i></div>
        <p id="滿額提示" class="discount-notice">目前未達滿額門檻（還差 $666 才能打折）</p>
        <div class="row minus off" id="rowDiscount"><span>滿額 95 折</span><span class="num" id="discountAmt">−$0</span></div>

        <!-- 折扣碼 -->
        <div class="coupon">
          <label for="couponCode">折扣碼</label>
          <input type="text" id="couponCode" placeholder="輸入 VIP 折 $50" oninput="calculate()" autocomplete="off">
        </div>
        <p class="coupon-msg" id="couponMsg"></p>
        <div class="row minus off" id="rowCoupon"><span>折扣碼折抵</span><span class="num" id="couponAmt">−$0</span></div>

        <!-- 最終總金額 -->
        <div class="final"><span>應付金額</span><span class="num" id="finalTotal">$0</span></div>
      </div>
    </aside>
  </main>

<script>
  // 每個品項的口味清單；每個口味各有一個數量欄位，id 為 NUM{品項}_{口味}，例如 NUM1_2 = 鹹爆米花
  const items = [
    { name:'爆米花', price:150, sub:'subtotal1', box:'flavors1', flavors:['甜','鹹','綜合'] },
    { name:'吉拿棒', price:80,  sub:'subtotal2', box:'flavors2', flavors:['原味','巧克力'] },
    { name:'熱狗堡', price:80,  sub:'subtotal3', box:'flavors3', flavors:['不加醬','番茄醬','黃芥末'] },
    { name:'軟飲',   price:45,  sub:'subtotal4', box:'flavors4', flavors:['可樂','雪碧','檸檬紅茶'] }
  ];
  const THRESHOLD = 666;
  const $ = id => document.getElementById(id);

  // 產生每個口味的數量加減欄位
  items.forEach((it, i) => {
    $(it.box).innerHTML = it.flavors.map((f, j) => {
      const id = `NUM${i + 1}_${j + 1}`;
      return `<div class="flavor" id="row_${id}"><span>${f}</span><div class="qty">
        <button type="button" data-target="${id}" data-step="-1" aria-label="${it.name}${f}減一">−</button>
        <input class="num" type="number" id="${id}" value="0" min="0" inputmode="numeric" aria-label="${it.name}${f}數量">
        <button type="button" data-target="${id}" data-step="1" aria-label="${it.name}${f}加一">+</button>
      </div></div>`;
    }).join('');
  });

  function qtyOf(i, j){
    const el = $(`NUM${i + 1}_${j + 1}`);
    let n = parseInt(el.value) || 0;
    if (n < 0) { n = 0; el.value = 0; }
    return n;
  }

  function calculate(){
    // 1. 各品項小計（所有口味數量加總 × 單價）與點餐明細
    let rawTotal = 0;
    const lines = [];
    items.forEach((it, i) => {
      let count = 0;
      it.flavors.forEach((f, j) => {
        const n = qtyOf(i, j);
        count += n;
        $(`row_NUM${i + 1}_${j + 1}`).classList.toggle('on', n > 0);
        if (n > 0) lines.push(`<li><span>${it.name}（${f}）<em> ×${n}</em></span><span class="num">$${it.price * n}</span></li>`);
      });
      const sub = it.price * count;
      $(it.sub).textContent = sub;
      rawTotal += sub;
    });
    $('orderLines').innerHTML = lines.length ? lines.join('') : '<li class="empty">還沒有點餐，加上數量就會出現在這裡。</li>';

    // 2. 總計（折扣前）
    $('grandTotal').textContent = '$' + rawTotal;
    let currentTotal = rawTotal;

    // 3. 滿 666 打 95 折
    const notice = $('滿額提示');
    $('meterBar').style.width = Math.min(rawTotal / THRESHOLD, 1) * 100 + '%';
    if (rawTotal >= THRESHOLD) {
      currentTotal = Math.round(currentTotal * 0.95);
      notice.textContent = '✨ 已達 $666 門檻，已自動套用 95 折！';
      notice.style.color = 'var(--ok)';
      $('meter').classList.add('full');
    } else {
      notice.textContent = `目前未達滿額門檻（還差 $${THRESHOLD - rawTotal} 才能打折）`;
      notice.style.color = '';
      $('meter').classList.remove('full');
    }
    const discount = rawTotal - currentTotal;
    $('discountAmt').textContent = '−$' + discount;
    $('rowDiscount').classList.toggle('off', discount === 0);

    // 4. 折扣碼 VIP 再折 50 元（最低不扣到負數）
    const code = $('couponCode').value.trim().toUpperCase();
    const msg = $('couponMsg');
    let couponOff = 0;
    if (code === 'VIP') {
      couponOff = Math.min(50, currentTotal);
      currentTotal -= couponOff;
      msg.textContent = '折扣碼已套用';
      msg.className = 'coupon-msg ok';
    } else if (code) {
      msg.textContent = '查無此折扣碼，請確認後重新輸入';
      msg.className = 'coupon-msg bad';
    } else {
      msg.textContent = '';
      msg.className = 'coupon-msg';
    }
    $('couponAmt').textContent = '−$' + couponOff;
    $('rowCoupon').classList.toggle('off', couponOff === 0);

    // 5. 熱狗堡圖示：有點番茄醬／黃芥末就畫出對應的醬
    $('ketchupLine').setAttribute('visibility', qtyOf(2, 1) > 0 ? 'visible' : 'hidden');
    $('mustardLine').setAttribute('visibility', qtyOf(2, 2) > 0 ? 'visible' : 'hidden');

    // 6. 最終金額
    $('finalTotal').textContent = '$' + currentTotal;
  }

  // 手動輸入數量
  document.addEventListener('input', e => {
    if (e.target.matches('.flavor input')) calculate();
  });
  // 數量加減按鈕
  document.addEventListener('click', e => {
    const btn = e.target.closest('.qty button');
    if (!btn) return;
    const input = $(btn.dataset.target);
    input.value = Math.max(0, (parseInt(input.value) || 0) + Number(btn.dataset.step));
    calculate();
  });

  calculate();
</script>
</body>
</html>
